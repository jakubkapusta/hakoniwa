<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#efe4cf" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Hakoniwa</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

  <body>
    <canvas id="c"></canvas>

    <section id="shelf" class="screen show">
      <header class="shelf-head">
        <div class="logo"><b>箱庭</b><span>Hakoniwa</span></div>
        <p>Kartonowe dioramy do złożenia. Wybierz pudełko.</p>
      </header>
      <div id="boxes"></div>
      <footer class="shelf-foot"><button id="muteBtn2" class="ghost"></button></footer>
    </section>

    <div id="hud" class="screen">
      <header id="top">
        <div>
          <button id="backBtn" class="pill">‹ Półka</button>
          <div id="step"><div id="stepNum">1</div><div><div id="stepName"></div><div id="dots"></div></div></div>
        </div>
        <div class="btns"><button id="autoBtn" class="pill" hidden>▶ Auto</button><button id="muteBtn" class="pill round"></button></div>
      </header>
      <div id="hint">Przeciągnij kawałek z tacy na jego zarys na scenie</div>
      <nav id="tray"></nav>
      <div id="final">
        <div id="finalJp" class="jp"></div>
        <div id="finalTitle" class="t"></div>
        <div id="finalSecret" class="s"></div>
        <div class="row"><button id="duskBtn"></button><button id="shelfBtn">Na półkę</button><button id="againBtn">↺ Od nowa</button></div>
      </div>
    </div>
    <div id="toast"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
